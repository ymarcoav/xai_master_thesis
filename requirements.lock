# Python 3.14.0 (CPython, Windows 11, AMD64)
#
# Recreate with:
#     py -3.14 -m venv .venv
#     .venv/Scripts/python -m pip install -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cpu
#     .venv/Scripts/python -m pip install -e . --no-deps
#
# The explanation results depend on library versions, in particular:
#   shap 0.52.0    permutation explainer budget (max_evals) and seeding; TreeExplainer returns
#                  log-odds for multiclass XGBoost.
#   lime 0.2.0.1   default number of perturbation samples (5000) and kernel width.
#
# torch is the CPU build, served from the PyTorch package index (--extra-index-url above).


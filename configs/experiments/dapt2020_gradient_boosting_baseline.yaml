name: dapt2020_gradient_boosting_baseline
dataset: dapt2020
model: gradient_boosting
random_state: 42
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
model_params:
  max_leaf_nodes: 15
  max_iter: 300
  max_depth: 5
  learning_rate: 0.05
  l2_regularization: 0.5

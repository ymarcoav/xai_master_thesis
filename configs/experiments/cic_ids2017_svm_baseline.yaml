name: cic_ids2017_svm_baseline
dataset: cic_ids2017
model: svm
random_state: 42
# Global SHAP for this model takes about 53 hours in a single process, so explain.py skips it
# by default. Compute it once with scripts/explain.py --shap-chunk-size 5 --shap-n-jobs 8
# after setting this to false.
skip_global_shap: true
model_params:
  C: 10
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
- pr_auc_macro

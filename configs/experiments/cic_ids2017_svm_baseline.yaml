name: cic_ids2017_svm_baseline
dataset: cic_ids2017
model: svm
random_state: 42
# max_iter capped well below models.py's default 50_000 safety cap, specifically for this
# experiment's final fit: this dataset's svm final fit has a documented history of running
# 24+ hours without completing at full scale (see README.md), and unsw_nb15's equivalent
# full-scale fit (no subsample as of 2026-08-27) confirmed the same pattern, running 18+ hours
# without converging or hitting the default cap - each libsvm iteration itself costs far more
# at this scale, so the iteration cap alone didn't bound wall-clock time. 5,000 trades
# convergence quality for a fit that actually finishes in bounded time; expect a
# ConvergenceWarning and a less-converged model than a full run would give, disclosed as a
# real tradeoff, not hidden.
model_params:
  C: 10
  max_iter: 5000
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
- pr_auc_macro

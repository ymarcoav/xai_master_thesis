name: unsw_nb15_random_forest_baseline
dataset: unsw_nb15
model: random_forest
random_state: 42
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
- pr_auc_macro
model_params:
  n_estimators: 100
  min_samples_split: 2
  min_samples_leaf: 1
  max_features: log2
  max_depth: 15

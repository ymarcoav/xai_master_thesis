name: unsw_nb15_random_forest_baseline
dataset: unsw_nb15
model: random_forest
random_state: 42
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
- pr_auc_macro
model_params:
  n_estimators: 500
  min_samples_split: 20
  min_samples_leaf: 2
  max_features: 0.5
  max_depth: 20

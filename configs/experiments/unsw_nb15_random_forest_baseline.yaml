name: unsw_nb15_random_forest_baseline
dataset: unsw_nb15
model: random_forest
random_state: 42
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- precision_attack
- recall_attack
- f1_attack
- roc_auc
- pr_auc
model_params:
  n_estimators: 100
  min_samples_split: 5
  min_samples_leaf: 2
  max_features: 0.5
  max_depth: 30

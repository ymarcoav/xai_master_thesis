name: cic_ids2017_neural_network_baseline
dataset: cic_ids2017
model: neural_network
random_state: 42
model_params:
  max_iter: 300
  early_stopping: true
  learning_rate_init: 0.0005
  hidden_layer_sizes:
  - 128
  - 64
  alpha: 0.01
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro

name: cic_ids2017_gradient_boosting_baseline
dataset: cic_ids2017
model: gradient_boosting
random_state: 42
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
model_params:
  max_leaf_nodes: 31
  max_iter: 100
  max_depth: 20
  learning_rate: 0.2
  l2_regularization: 1.0

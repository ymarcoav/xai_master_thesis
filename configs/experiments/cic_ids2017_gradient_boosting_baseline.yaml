name: cic_ids2017_gradient_boosting_baseline
dataset: cic_ids2017
model: gradient_boosting
random_state: 42
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
- pr_auc_macro
model_params:
  max_leaf_nodes: 63
  max_iter: 100
  max_depth: 5
  learning_rate: 0.1
  l2_regularization: 0.3
  min_samples_leaf: 30

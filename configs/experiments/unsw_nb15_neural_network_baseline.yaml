name: unsw_nb15_neural_network_baseline
dataset: unsw_nb15
model: neural_network
random_state: 42
model_params:
  max_iter: 300
  early_stopping: true
  learning_rate_init: 0.001
  hidden_layer_sizes:
  - 256
  - 128
  - 64
  alpha: 0.0001
  batch_size: 256
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
- pr_auc_macro

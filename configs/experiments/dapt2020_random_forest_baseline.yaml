name: dapt2020_random_forest_baseline
dataset: dapt2020
model: random_forest
random_state: 42
preprocessing:
  strategy: default_tabular
explainability:
  methods:
  - shap
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
model_params:
  n_estimators: 200
  min_samples_leaf: 1
  max_features: sqrt
  max_depth: 40

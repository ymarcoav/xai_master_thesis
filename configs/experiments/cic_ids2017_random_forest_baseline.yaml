name: cic_ids2017_random_forest_baseline
dataset: cic_ids2017
model: random_forest
random_state: 42
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
model_params:
  n_estimators: 200
  min_samples_leaf: 2
  max_features: sqrt
  max_depth: 40

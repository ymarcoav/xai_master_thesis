name: unsw_nb15_svm_baseline
dataset: unsw_nb15
model: svm
random_state: 42
# max_iter capped well below models.py's default 50_000 safety cap, specifically for this
# experiment's final fit: at the full ~1.36M-row training set (no subsample as of 2026-08-27),
# a single fit ran 18+ hours without converging or hitting the default cap - each libsvm
# iteration itself costs far more at this scale, so the iteration cap alone didn't bound
# wall-clock time. 5,000 trades convergence quality for a fit that actually finishes in
# bounded time; expect a ConvergenceWarning and a less-converged model than a full run would
# give, disclosed as a real tradeoff, not hidden.
model_params:
  C: 10
  max_iter: 5000
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
- pr_auc_macro

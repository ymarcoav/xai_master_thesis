name: unsw_nb15_gradient_boosting_baseline
dataset: unsw_nb15
model: gradient_boosting
random_state: 42
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
- pr_auc_macro
model_params:
  max_leaf_nodes: 15
  max_iter: 300
  max_depth: 10
  learning_rate: 0.03
  l2_regularization: 0.7
  min_samples_leaf: 10

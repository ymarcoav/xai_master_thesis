name: unsw_nb15_gradient_boosting_baseline
dataset: unsw_nb15
model: gradient_boosting
random_state: 42
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- precision_attack
- recall_attack
- f1_attack
- roc_auc
- pr_auc
model_params:
  max_leaf_nodes: 63
  max_iter: 300
  max_depth: 15
  learning_rate: 0.05
  l2_regularization: 0.7
  min_samples_leaf: 10

name: nsl_kdd_random_forest_baseline
dataset: nsl_kdd
model: random_forest
random_state: 42
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
- pr_auc_macro
model_params:
  n_estimators: 200
  min_samples_split: 5
  min_samples_leaf: 2
  max_features: sqrt
  max_depth: 30

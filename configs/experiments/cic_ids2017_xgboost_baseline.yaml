name: cic_ids2017_xgboost_baseline
dataset: cic_ids2017
model: xgboost
random_state: 42
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
- pr_auc_macro
# model_params: RandomizedSearchCV result (scripts/train.py --tune). The expert interviews used
# explanations of an earlier xgboost configuration, archived with its model and plots in
# outputs/_archive/xgboost_interview_model/.
model_params:
  subsample: 0.8
  reg_lambda: 2.0
  n_estimators: 200
  min_child_weight: 1
  max_depth: 5
  learning_rate: 0.3
  colsample_bytree: 0.6

# ARCHIVED as of 2026-08-17: moved out of configs/datasets/ (and its data/outputs out of the
# active data/ and outputs/ trees into the _archive/ mirrors below) since DAPT2020 is out of
# thesis scope. raw_path/processed_path below already point at the new archive locations, so
# this config is still fully functional if run explicitly (e.g. `--config-dir
# configs/_archive/datasets`) - nothing was deleted, just moved out of what the default
# (no-args) pipeline commands touch.
name: dapt2020
raw_path: data/_archive/dapt2020/raw
processed_path: data/_archive/dapt2020/processed
label_column: Stage

# Fill in after inspecting the raw files.
categorical_columns: []
drop_columns:
  - Flow ID
  - Activity
  - Src IP
  - Dst IP
  # Timestamp is intentionally not here - see datasets/dapt2020.py's clean() docstring: it
  # survives cleanup so pipeline.py's train/test split can sort by it, and is dropped there
  # right after, before ever reaching preprocessing/the model.
  # Src Port is mostly ephemeral noise with a clear testbed-specific identity leak
  # (Lateral Movement dominated by two fixed ports). Dst Port's attack-stage signal is
  # dominated by a 9000-9003 band that recurs across stages - almost certainly this
  # testbed's own C2/attack framework's fixed ports rather than a generalizable protocol
  # signal (contrast with CIC-IDS2017's Destination Port, which maps onto real IANA
  # well-known ports like 21/22/80 and is kept). Found via the SHAP/PFI explainability
  # analysis surfacing suspicious port dominance.
  - Src Port
  - Dst Port

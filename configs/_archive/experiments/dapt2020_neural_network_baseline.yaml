# ARCHIVED as of 2026-08-17: moved out of configs/experiments/ since this dataset is out of
# thesis scope - config/model/metrics/plots all untouched otherwise, still fully functional.
# To rerun: python scripts/train.py --experiment configs/_archive/experiments/dapt2020_neural_network_baseline.yaml --dataset-config-dir configs/_archive/datasets
name: dapt2020_neural_network_baseline
dataset: dapt2020
model: neural_network
random_state: 42
model_params:
  max_iter: 300
  early_stopping: true
  learning_rate_init: 0.005
  hidden_layer_sizes:
  - 256
  - 128
  - 64
  alpha: 0.0001
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
- pr_auc_macro

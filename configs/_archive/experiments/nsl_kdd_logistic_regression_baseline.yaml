# ARCHIVED as of 2026-08-17: moved out of configs/experiments/ since this dataset is out of
# thesis scope - config/model/metrics/plots all untouched otherwise, still fully functional.
# To rerun: python scripts/train.py --experiment configs/_archive/experiments/nsl_kdd_logistic_regression_baseline.yaml --dataset-config-dir configs/_archive/datasets
name: nsl_kdd_logistic_regression_baseline
dataset: nsl_kdd
model: logistic_regression
random_state: 42
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
- pr_auc_macro
model_params:
  C: 100
  max_iter: 1000

# ARCHIVED as of 2026-08-17: moved out of configs/experiments/ since this dataset is out of
# thesis scope - config/model/metrics/plots all untouched otherwise, still fully functional.
# To rerun: python scripts/train.py --experiment configs/_archive/experiments/nsl_kdd_random_forest_baseline.yaml --dataset-config-dir configs/_archive/datasets
name: nsl_kdd_random_forest_baseline
dataset: nsl_kdd
model: random_forest
random_state: 42
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
- pr_auc_macro
model_params:
  n_estimators: 200
  min_samples_split: 5
  min_samples_leaf: 2
  max_features: sqrt
  max_depth: 30

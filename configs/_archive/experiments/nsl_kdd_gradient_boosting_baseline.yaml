# ARCHIVED as of 2026-08-17: moved out of configs/experiments/ since this dataset is out of
# thesis scope - config/model/metrics/plots all untouched otherwise, still fully functional.
# To rerun: python scripts/train.py --experiment configs/_archive/experiments/nsl_kdd_gradient_boosting_baseline.yaml --dataset-config-dir configs/_archive/datasets
name: nsl_kdd_gradient_boosting_baseline
dataset: nsl_kdd
model: gradient_boosting
random_state: 42
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
- pr_auc_macro
model_params:
  min_samples_leaf: 30
  max_leaf_nodes: 7
  max_iter: 300
  max_depth: 3
  learning_rate: 0.3
  l2_regularization: 1.0

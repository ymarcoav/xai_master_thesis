# ARCHIVED as of 2026-08-17: moved out of configs/experiments/ since this dataset is out of
# thesis scope - config/model/metrics/plots all untouched otherwise, still fully functional.
# To rerun: python scripts/train.py --experiment configs/_archive/experiments/dapt2020_gradient_boosting_baseline.yaml --dataset-config-dir configs/_archive/datasets
name: dapt2020_gradient_boosting_baseline
dataset: dapt2020
model: gradient_boosting
random_state: 42
preprocessing:
  strategy: default_tabular
metrics:
- accuracy
- precision_macro
- recall_macro
- f1_macro
- roc_auc_macro
- pr_auc_macro
model_params:
  max_leaf_nodes: 15
  max_iter: 300
  max_depth: 5
  learning_rate: 0.05
  l2_regularization: 0.5

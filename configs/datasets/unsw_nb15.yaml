name: unsw_nb15
raw_path: data/raw/UNSW_NB15
processed_path: data/processed/unsw_nb15
# Multiclass target: the native attack category (nine attack classes plus Benign).
label_column: attack_cat

# Column descriptions, not traffic data; skipped by scripts/inspect_datasets.py.
exclude_files:
  - NUSW-NB15_features.csv

categorical_columns:
  - proto
  - service
  - state

# srcip, sport, dstip, dsport: connection identifiers (metadata, prone to shortcut learning).
# ltime, stime: absolute capture timestamps (artifacts of the capture schedule).
# label: native binary label (attack_cat is the target).
# ct_ftp_cmd: near-redundant with is_ftp_login (r = 0.92); where nonzero (2% of records) its
#   mean is about 1 in every class in which it occurs, so it does not separate the classes.
drop_columns:
  - srcip
  - sport
  - dstip
  - dsport
  - ltime
  - label
  - ct_ftp_cmd
  - stime

# The constant / near-duplicate screen (scripts/feature_screen.py) removes nothing: no column is
# constant, and the closest pair, swin/dwin, still differs in 2,540 records.
screen_drop_columns: []

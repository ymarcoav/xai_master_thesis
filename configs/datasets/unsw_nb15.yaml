name: unsw_nb15
raw_path: data/raw/UNSW_NB15
processed_path: data/processed/unsw_nb15
label_column: label

# Binary classification: label is UNSW-NB15's own native Normal/Attack ground truth
# (0/1), used in place of the multiclass attack_cat, to match prior literature that
# reports binary results for this dataset.
categorical_columns:
  - proto
  - service
  - state
drop_columns:
  - id
  - attack_cat

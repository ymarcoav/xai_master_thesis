name: unsw_nb15
raw_path: data/raw/UNSW_NB15
processed_path: data/processed/unsw_nb15
label_column: attack_cat

# NUSW-NB15_features.csv is the column-schema/description file (Name/Type/Description per
# feature), not traffic data - excluded from dataset_inspection so it doesn't get mixed into
# the aggregate row/column stats for the 4 actual UNSW-NB15_*.csv data files.
exclude_files:
  - NUSW-NB15_features.csv

# Multiclass classification: attack_cat is UNSW-NB15's own native 10-category ground
# truth (Normal + Generic/Exploits/Fuzzers/DoS/Reconnaissance/Analysis/Backdoor/
# Shellcode/Worms), the standard scheme used throughout UNSW-NB15 literature (Moustafa
# & Slay 2015) essentially as-is - unlike NSL-KDD/CIC-IDS2017, there's no common further
# consolidation of this scheme in the literature. The native binary label (0/1) is
# dropped in favor of this.
categorical_columns:
  - proto
  - service
  - state
# srcip/dstip/sport/dsport: raw identifiers, not present in the pre-built training-set/
# testing-set files this project used previously - dropped to avoid a model memorizing
# attacker/victim addresses instead of learning traffic behavior. ltime: redundant with
# dur/stime. label: native binary, dropped in favor of attack_cat.
# ct_ftp_cmd: dropped 2026-08-13 - verified via direct data inspection that it correlates
# with is_ftp_login at r~=0.85 (near-redundant with a feature already kept) and, when nonzero
# (only ~1.7% of rows), its mean value is ~1.0-1.2 across every attack_cat that has any
# nonzero rows at all - no visible per-class differentiation. This drop stands on its own
# evidence, independent of the service decision below.
# service: dropped 2026-08-13 following Tai et al. 2024's UNSW-NB15 preprocessing, then
# RESTORED the same day once the user set explicit policy ("improve performance" wins over
# matching a paper's own undocumented preprocessing choices when the two conflict) - dropping
# service had measurably cost real macro-F1 (gradient_boosting 0.569->0.507, random_forest
# 0.566->0.524), so under that policy it belongs back in the feature set.
# stime: absolute flow-start timestamp, never a model feature. Kept through clean() only so
# dedup can collapse a flow recorded twice at different times; dropped here in the same step
# as the other non-features (2026-08-31 - previously carried further and dropped in the split,
# which the old chronological split needed to sort by; the stratified random split does not).
drop_columns:
  - srcip
  - sport
  - dstip
  - dsport
  - ltime
  - label
  - ct_ftp_cmd
  - stime

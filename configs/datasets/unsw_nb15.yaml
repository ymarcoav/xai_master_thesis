name: unsw_nb15
raw_path: data/raw/UNSW_NB15
processed_path: data/processed/unsw_nb15
label_column: attack_cat

# NUSW-NB15_features.csv is the column-schema/description file (Name/Type/Description per
# feature), not traffic data - excluded from dataset_inspection so it doesn't get mixed into
# the aggregate row/column stats for the 4 actual UNSW-NB15_*.csv data files.
exclude_files:
  - NUSW-NB15_features.csv

# Multiclass classification: attack_cat is UNSW-NB15's own native 10-category ground
# truth (Normal + Generic/Exploits/Fuzzers/DoS/Reconnaissance/Analysis/Backdoor/
# Shellcode/Worms), the standard scheme used throughout UNSW-NB15 literature (Moustafa
# & Slay 2015) essentially as-is - unlike NSL-KDD/CIC-IDS2017, there's no common further
# consolidation of this scheme in the literature. The native binary label (0/1) is
# dropped in favor of this.
categorical_columns:
  - proto
  - state
# srcip/dstip/sport/dsport: raw identifiers, not present in the pre-built training-set/
# testing-set files this project used previously - dropped to avoid a model memorizing
# attacker/victim addresses instead of learning traffic behavior. ltime: redundant with
# dur/stime. label: native binary, dropped in favor of attack_cat. service: dropped
# 2026-08-13 following Tai et al. 2024's UNSW-NB15 preprocessing (their choice, no stated
# rationale - but it's "unknown" (the raw "-"/blank placeholder) for 57.33% of rows across
# both splits, a plausible unstated reason for their manual "not valuable" call, matching
# that they did NOT run automated feature selection for UNSW-NB15 unlike CIC-IDS2017).
# ct_ftp_cmd: also dropped 2026-08-13 - verified via direct data inspection (not just
# following Tai et al.'s unexplained "handled or removed" for this column) that it
# correlates with is_ftp_login at r=0.92 (near-redundant with a feature already kept) and,
# when nonzero (only 1.95% of rows), its mean value is ~1.0-1.06 across every attack_cat
# that has any nonzero rows at all - no visible per-class differentiation, unlike the
# near-constant CIC-IDS2017 flag columns kept for their datasets/cic_ids2017.yaml, where no
# such redundancy-with-a-kept-feature was found. stime is deliberately NOT listed here -
# see datasets/unsw_nb15.py's clean().
drop_columns:
  - srcip
  - sport
  - dstip
  - dsport
  - ltime
  - label
  - service
  - ct_ftp_cmd

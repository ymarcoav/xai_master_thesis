name: cic_ids2017
raw_path: data/raw/CIC_IDS2017
processed_path: data/processed/cic_ids2017
label_column: Label

# Fill in after inspecting the raw files.
categorical_columns: []
# Verified zero-variance in the actual processed data (a single constant value - 0 - across
# every row of both the train and test splits, not just an example from a third-party paper):
# the two backward-direction PSH/URG flag counts, and all six *_Bulk/Bulk_Rate columns
# (Fwd/Bwd Avg Bytes per Bulk, Avg Packets per Bulk, Avg Bulk Rate). Left in place, these
# constant columns are functionally dead weight - MinMaxScaler passes a constant column
# through as inert zeros rather than erroring, so nothing breaks, but they add noise to
# SHAP/permutation-importance rankings and PDP plots. NOT included here: the four near-constant
# (but not literally zero-variance) flag columns Fwd URG Flags/RST/CWE/ECE Flag Count
# (99.97-99.996% one value) - those still carry rare-but-real signal, unlike a truly constant
# column, and this project's severely imbalanced datasets already lean on exactly this kind of
# rare-but-informative signal elsewhere.
# Near-exact-duplicate columns, verified 2026-08-13 via direct pairwise correlation on the
# full processed train.csv (not just a plotted sample - a sample-based check of this same
# data initially also flagged Fwd/Bwd Header Length as a "duplicate" pair, which turned out
# to be a sampling artifact caused by a handful of corrupted rows dominating whichever random
# sample was drawn; re-verified on the full 2.83M rows before trusting any of these). Each
# pair below is correlated at 1.000 (RST/ECE Flag Count: 0.998) on the full data - one column
# of each pair is dropped as redundant, keeping whichever name is the more standard/
# interpretable of the two for feature-importance write-ups:
#   Total Fwd/Backward Packets kept over Subflow Fwd/Bwd Packets (same value, subflow==total
#     whenever a flow has a single subflow, the common case)
#   Fwd/Bwd Packet Length Mean kept over Avg Fwd/Bwd Segment Size (literal alias)
#   Total Length of Fwd/Bwd Packets kept over Subflow Fwd/Bwd Bytes (same reasoning as above)
#   SYN Flag Count kept over Fwd PSH Flags (exact 1.000 correlation in this data - plausibly
#     another CICFlowMeter internal-counter quirk rather than a meaningful relationship, but
#     redundant either way; SYN is the more security-interpretable of the two)
#   RST Flag Count kept over ECE Flag Count (RST is far more relevant to scan/attack
#     detection than the rarely-used ECN-Echo flag)
#   Fwd URG Flags kept over CWE Flag Count (same reasoning - URG is the more interpretable
#     name; Bwd URG Flags is already dropped below as zero-variance)
drop_columns:
  - Bwd PSH Flags
  - Bwd URG Flags
  - Fwd Avg Bytes/Bulk
  - Fwd Avg Packets/Bulk
  - Fwd Avg Bulk Rate
  - Bwd Avg Bytes/Bulk
  - Bwd Avg Packets/Bulk
  - Bwd Avg Bulk Rate
  - Subflow Fwd Packets
  - Subflow Bwd Packets
  - Avg Fwd Segment Size
  - Avg Bwd Segment Size
  - Subflow Fwd Bytes
  - Subflow Bwd Bytes
  - Fwd PSH Flags
  - CWE Flag Count
  - ECE Flag Count
